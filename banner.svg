<svg width="100%" height="130" viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for text -->
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff">
        <animate attributeName="stop-color" values="#00f7ff;#8a2be2;#00f7ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#00f7ff;#8a2be2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Line gradient -->
    <linearGradient id="gradLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font: bold 34px 'Segoe UI', sans-serif;
      fill: url(#gradText);
      text-anchor: middle;
      dominant-baseline: middle;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .subtitle {
      font: 16px 'Segoe UI', sans-serif;
      fill: #c9d1d9;
      text-anchor: middle;
      dominant-baseline: middle;
      opacity: 0.85;
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 5px #00f7ff);
      }
      to {
        filter: drop-shadow(0 0 15px #8a2be2);
      }
    }

    .bg {
      fill: #0d1117;
    }

    .line {
      stroke: url(#gradLine);
      stroke-width: 2;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 2.5s ease forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Animated Lines -->
  <line x1="120" y1="25" x2="680" y2="25" class="line"/>
  <line x1="120" y1="105" x2="680" y2="105" class="line"/>

  <!-- Text -->
  <text x="400" y="60" class="title">Nirmal Singh</text>
  <text x="400" y="90" class="subtitle">Full Stack Developer • AI/ML Enthusiast</text>
</svg>
