<svg width="100%" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">

  <!-- 🌈 Animated Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#1a1f2b;#0d1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a1f2b">
        <animate attributeName="stop-color" values="#1a1f2b;#0d1117;#1a1f2b" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 🌈 Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff">
        <animate attributeName="stop-color" values="#00f7ff;#8a2be2;#00f7ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#00f7ff;#8a2be2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <style>
    .title {
      font: bold 36px 'Segoe UI', sans-serif;
      fill: url(#textGradient);
      text-anchor: middle;
      dominant-baseline: middle;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .subtitle {
      font: 16px 'Segoe UI', sans-serif;
      fill: #c9d1d9;
      text-anchor: middle;
      opacity: 0.85;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 5px #00f7ff); }
      to { filter: drop-shadow(0 0 20px #8a2be2); }
    }

    .particle {
      fill: #00f7ff;
      opacity: 0.6;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px); opacity: 0.6; }
      50% { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.6; }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- ✨ Particles -->
  <circle cx="100" cy="30" r="2" class="particle"/>
  <circle cx="200" cy="80" r="2" class="particle" style="animation-delay:1s"/>
  <circle cx="350" cy="40" r="2" class="particle" style="animation-delay:2s"/>
  <circle cx="500" cy="90" r="2" class="particle" style="animation-delay:3s"/>
  <circle cx="650" cy="50" r="2" class="particle" style="animation-delay:4s"/>
  <circle cx="750" cy="70" r="2" class="particle" style="animation-delay:5s"/>

  <!-- Text -->
  <text x="400" y="65" class="title">Nirmal Singh</text>
  <text x="400" y="100" class="subtitle">Full Stack Developer • AI/ML Enthusiast</text>

</svg>
